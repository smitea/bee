[package]
name = "bee-plugin-mongodb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee production-grade MongoDB adapter (S37): real mongodb driver + per-call collection + change streams"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-plugin-sdk = { path = "../../../crates/bee-plugin-sdk" }
bee-adapter = { path = "../../../crates/bee-adapter" }
tokio = { version = "1", features = ["full"] }
mongodb = { version = "3", default-features = false, features = ["compat-3-3-0", "bson-2", "rustls-tls", "dns-resolver"] }
bson = { version = "2", features = ["chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
bincode = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
log = "0.4"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"

[lints]
workspace = true
