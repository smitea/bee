[package]
name = "bee-plugin-binance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee 量化交易参考实现:实时价格流 InputAdapter。Plugin 结构是 production-grade (cdylib + FFI vtable);实际数据源是 sine-wave 占位,等 S34 production 实装时替换。"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-plugin-sdk = { path = "../../../crates/bee-plugin-sdk" }
bee-adapter = { path = "../../../crates/bee-adapter" }
tokio = { workspace = true }
thiserror = "2"
bincode = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bee-registry = { path = "../../../crates/bee-registry" }

[lints]
workspace = true
