[package]
name = "bee-plugin-binance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee production-grade Binance adapter (S34): real WebSocket + REST + backfill-on-subscribe semantics"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-adapter = { path = "../../../crates/bee-adapter" }
bee-plugin-sdk = { path = "../../../crates/bee-plugin-sdk" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
futures = "0.3"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"

[lints]
workspace = true
