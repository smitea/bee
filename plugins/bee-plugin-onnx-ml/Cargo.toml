[package]
name = "bee-plugin-onnx-ml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee production-grade ONNX ML model Handlers (S39): real tract runtime + FinBERT sentiment + user-supplied decision model"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-plugin-sdk = { path = "../../crates/bee-plugin-sdk" }
tract-onnx = { version = "0.21" }
ndarray = "0.15"
tokenizers = { version = "0.15" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
log = "0.4"
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
