[package]
name = "bee_plugin_sample_kline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Sample Bee plugin demonstrating the Reload from disk flow (Settings > Plugins)"

[lib]
crate-type = ["cdylib"]

[dependencies]
bee-adapter = { path = "../../crates/bee-adapter" }
bee-plugin-sdk = { path = "../../crates/bee-plugin-sdk" }
bee-plugin-macro = { path = "../../crates/bee-plugin-macro" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
tokio = { workspace = true }
futures = "0.3"