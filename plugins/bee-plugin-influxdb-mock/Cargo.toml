[package]
name = "bee-plugin-influxdb-mock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee mock plugin: influxdb_emit Output Adapter (log file sink)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-plugin-sdk = { path = "../../crates/bee-plugin-sdk" }
bee-adapter = { path = "../../crates/bee-adapter" }
tokio = { workspace = true, features = ["fs"] }
thiserror = "2"

[lints]
workspace = true
