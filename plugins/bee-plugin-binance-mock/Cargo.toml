[package]
name = "bee-plugin-binance-mock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Bee mock plugin: binance_subscribe Input Adapter (synthetic K-line sine wave)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bee-plugin-sdk = { path = "../../crates/bee-plugin-sdk" }
bee-adapter = { path = "../../crates/bee-adapter" }
tokio = { workspace = true }
thiserror = "2"
bincode = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bee-registry = { path = "../../crates/bee-registry" }

[lints]
workspace = true
