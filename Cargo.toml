[workspace]
resolver = "2"
members = [
    "crates/bee-transport",
    "crates/bee-codec",
    "crates/bee-session",
    "crates/bee-runtime",
    "crates/bee-control",
    "crates/bee-registry",
    "crates/bee-dsl-sql",
    "crates/bee-kv-test",
    "bee",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
bytes = "1"
datafusion = "49"
bee-codec = { path = "crates/bee-codec" }
bee-transport = { path = "crates/bee-transport" }
bee-runtime = { path = "crates/bee-runtime" }
bee-control = { path = "crates/bee-control" }

[workspace.lints.rust]
unsafe_code = "forbid"
