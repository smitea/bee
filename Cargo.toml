[workspace]
resolver = "2"
members = [
    "crates/bee-types",
    "crates/bee-transport",
    "crates/bee-codec",
    "crates/bee-session",
    "crates/bee-runtime",
    "crates/bee-control",
    "crates/bee-registry",
    "crates/bee-dsl-sql",
    "crates/bee-adapter",
    "crates/bee-plugin-sdk",
    "crates/bee-kv-test",
    "bee",
    "plugins/quant/bee-plugin-binance",
    "plugins/quant/bee-plugin-google-news",
    "plugins/quant/bee-plugin-influxdb",
    "plugins/quant/bee-plugin-mongodb",
    "plugins/quant/bee-plugin-ta-lib",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
bytes = "1"
datafusion = "50.0.0"
bee-codec = { path = "crates/bee-codec" }
bee-transport = { path = "crates/bee-transport" }
bee-runtime = { path = "crates/bee-runtime" }
bee-control = { path = "crates/bee-control" }
bee-types = { path = "crates/bee-types" }
bee-dsl-sql = { path = "crates/bee-dsl-sql" }
bee-adapter = { path = "crates/bee-adapter" }
bee-plugin-sdk = { path = "crates/bee-plugin-sdk" }

[workspace.lints.rust]
unsafe_code = "warn"
