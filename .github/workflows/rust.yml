name: Bee CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust-build:
    name: Rust build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            -> target
            -> crates/*/target
            -> bee/target
            -> plugins/*/target
            -> plugins/quant/*/target
      - name: Build (release)
        run: cargo build --workspace --release --verbose

  rust-test:
    name: Rust test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            -> target
            -> crates/*/target
            -> bee/target
            -> plugins/*/target
            -> plugins/quant/*/target
            -> app/src-tauri/target
      - name: Build sample plugin (release)
        run: cargo build --release -p bee_plugin_sample_kline --verbose
      - name: Test (release)
        run: cargo test --workspace --release --verbose
      - name: Test sample plugin Reload from disk
        working-directory: app/src-tauri
        run: |
          cargo test --test sample_plugin_load --release --verbose

  tauri-frontend-build:
    name: Tauri frontend build (Node.js + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install npm deps
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npx tsc --noEmit
      - name: Test frontend
        run: npm test
      - name: Build frontend bundle
        run: npm run build