bee-plugin-sdk = { workspace = true }
bee-dsl-sql = { workspace = true }
bee-transport = { workspace = true }
bee-codec = { workspace = true }
async-trait = "0.1"
bincode = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
