[package]
name = "bee-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bee 控制面: Raft 客户端 + 调度器 + Work-Stealing 仲裁 (Raft 集群仲裁的所有权变更)"

[dependencies]
tokio = { workspace = true }
futures = "0.3"
bee-runtime = { workspace = true }
bee-types = { workspace = true }
bee-plugin-sdk = { workspace = true }
bee-dsl-sql = { workspace = true }
bee-transport = { workspace = true }
bee-codec = { workspace = true }
bee-registry = { workspace = true }
async-trait = "0.1"
bincode = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[lints]
workspace = true

[features]
# S-1c: re-exports the `test_utils::TestCluster` harness for use
# by integration tests in this crate AND downstream crates
# (e.g. `bee-gui`). Production binaries must NOT enable this
# feature (no admin-server wiring, no test-timeout knobs).
default = []
test-utils = []

[dev-dependencies]
tempfile = "3"
# S-1c: integration tests in this crate consume the
# public `test_utils::TestCluster` harness (see
# tests/raft_cluster.rs, tests/wal_persistence.rs,
# tests/admin_forwarding_inmem.rs). Re-enable the
# feature for the `dev` profile so `cargo test -p
# bee-control` can see the module.
bee-control = { path = ".", features = ["test-utils"] }

