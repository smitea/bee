[package]
name = "bee-dsl-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bee SQL DSL: DataFusion-based SQL parser / planner / DAG 编译器 (ADR-0006)"

[lints]
workspace = true

[features]
test-fixtures = []

[dependencies]
datafusion = { workspace = true }
arrow-array = "56"
arrow-schema = "56"
bee-runtime = { workspace = true }
bee-plugin-sdk = { workspace = true }
# S41 (9c): in-process shortcut for the perf-fib plugin. The proper
# architecture loads `bee-plugin-perf-fib` as a cdylib via FFI; the
# S41 MVP links it as a regular rlib so the demo runs without the
# libloading dance. See `udfs.rs::register_perf_fib` for the
# dispatcher and the S41 plan §9c for the migration path.
bee-plugin-perf-fib = { path = "../../plugins/bee-plugin-perf-fib" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
