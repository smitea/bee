[package]
name = "bee-dsl-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bee SQL DSL: DataFusion-based SQL parser / planner / DAG 编译器 (ADR-0006)"

[lints]
workspace = true

[features]
test-fixtures = []

[dependencies]
datafusion = { workspace = true }
arrow-array = "56"
arrow-schema = "56"
bee-runtime = { workspace = true }
bee-plugin-sdk = { workspace = true }
# S41 follow-up 4: load the perf-fib cdylib at startup via libloading
# (replaces the S41 MVP's in-process rlib link). The cdylib is
# resolved at runtime by `plugin_loader::load_plugin`; the binary
# itself is built by `cargo build -p bee-plugin-perf-fib` and lives
# at `target/release/libbee_plugin_perf_fib.dylib` (or under
# `target/release/deps/`).
libloading = "0.8"
bincode = "1"
serde_json = "1"
thiserror = "2"
# S33.5.3: used by `dag::extract_phase_dag` to
# compute the pipeline DAG hash.
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
