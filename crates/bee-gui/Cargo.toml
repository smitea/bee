[package]
name = "bee-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bee cluster management GUI (iced / Rust)"

[lib]
name = "bee_gui"
path = "src/lib.rs"

[[bin]]
name = "bee-gui"
path = "src/main.rs"

[dependencies]
bee-control = { path = "../bee-control" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
iced = { version = "0.12", features = ["svg"] }

[dev-dependencies]
# S-1c: integration tests in tests/ boot a 3-node
# in-memory cluster via bee_control::test_utils::TestCluster.
# The harness is gated behind the `test-utils` feature;
# enable it for the test profile.
bee-control = { path = "../bee-control", features = ["test-utils"] }

[lints]
workspace = true

[package.metadata.deb]
name = "bee-gui"
maintainer = "smitea <smitea@example.com>"
description = "Bee cluster management GUI (iced / Rust)"
license-file = ["../../LICENSE"]
section = "admin"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/bee-gui", "usr/bin/", "755"],
]